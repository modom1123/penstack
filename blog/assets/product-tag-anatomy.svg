<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">A product listing with useful tags</title>
<desc id="desc">A clean ecommerce product card for a waterproof trail backpack, surrounded by tags for product characteristics, use case, season, and merchandising.</desc>
<rect width="900" height="650" rx="28" fill="#fffdf8"/>
<text x="450" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#132b3f">One product. Several useful labels.</text>
<text x="450" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#617080">Tags describe the product from different angles.</text>

<rect x="274" y="148" width="352" height="392" rx="24" fill="#fff" stroke="#e4e2d9" stroke-width="2"/>
<rect x="306" y="180" width="288" height="235" rx="18" fill="#eef4ef"/>

<!-- recognizable backpack silhouette -->
<path d="M396 225c0-36 22-62 54-62s54 26 54 62" fill="none" stroke="#294d5f" stroke-width="14" stroke-linecap="round"/>
<rect x="372" y="215" width="156" height="166" rx="34" fill="#35677f"/>
<rect x="392" y="252" width="116" height="58" rx="18" fill="#2a566c"/>
<rect x="391" y="326" width="118" height="38" rx="13" fill="#2a566c"/>
<path d="M372 252c-28 18-35 63-22 102M528 252c28 18 35 63 22 102" fill="none" stroke="#35677f" stroke-width="18" stroke-linecap="round"/>
<path d="M392 218c12-21 29-33 58-33s46 12 58 33" fill="none" stroke="#5d8294" stroke-width="10" stroke-linecap="round"/>
<circle cx="450" cy="281" r="7" fill="#f0aa17"/>

<text x="450" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17324d">Waterproof Trail Backpack</text>
<text x="450" y="483" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#617080">One product can belong to several useful groups.</text>

<g font-family="Arial,sans-serif" font-size="17" fill="#17324d">
  <rect x="58" y="205" width="158" height="48" rx="24" fill="#dff1ff"/><text x="137" y="236" text-anchor="middle">waterproof</text>
  <rect x="78" y="300" width="118" height="48" rx="24" fill="#dff5ea"/><text x="137" y="331" text-anchor="middle">hiking</text>
  <rect x="68" y="395" width="138" height="48" rx="24" fill="#fff0bd"/><text x="137" y="426" text-anchor="middle">recycled</text>
  <rect x="690" y="205" width="150" height="48" rx="24" fill="#f4eefb"/><text x="765" y="236" text-anchor="middle">daypack</text>
  <rect x="706" y="300" width="118" height="48" rx="24" fill="#fff0ee"/><text x="765" y="331" text-anchor="middle">fall</text>
  <rect x="687" y="395" width="156" height="48" rx="24" fill="#dff1ff"/><text x="765" y="426" text-anchor="middle">trail gear</text>
</g>
<g stroke="#c9d4cf" stroke-width="3" fill="none">
  <path d="M216 229h58"/><path d="M196 324h78"/><path d="M206 419h68"/>
  <path d="M626 229h64"/><path d="M626 324h80"/><path d="M626 419h61"/>
</g>

<rect x="170" y="570" width="560" height="44" rx="22" fill="#eef7f1"/>
<text x="450" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">characteristic · use case · season · merchandising</text>
</svg>