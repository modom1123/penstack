<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">What product tags look like</title><desc id="desc">A ceramic mug product card surrounded by example tags for material, size, use case, and audience.</desc>
<rect width="900" height="650" rx="28" fill="#fffdf8"/>
<text x="450" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#132b3f">One product. Several useful labels.</text>
<text x="450" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#617080">Tags describe the product from different angles.</text>
<rect x="250" y="160" width="400" height="360" rx="24" fill="#fff" stroke="#e4e2d9" stroke-width="2"/>
<ellipse cx="400" cy="330" rx="88" ry="105" fill="#f2eee4"/><rect x="330" y="255" width="140" height="150" rx="18" fill="#fffaf0" stroke="#d8d2c5" stroke-width="4"/><path d="M470 286c80-10 86 103 7 109" fill="none" stroke="#d8d2c5" stroke-width="18"/>
<circle cx="382" cy="326" r="10" fill="#df7b28"/><circle cx="415" cy="326" r="10" fill="#df7b28"/><path d="M388 350c17 13 29 13 45 0" fill="none" stroke="#df7b28" stroke-width="5" stroke-linecap="round"/>
<text x="450" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17324d">Ceramic dog-lover mug</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#17324d">
<rect x="70" y="210" width="135" height="48" rx="24" fill="#e7f6ed"/><text x="138" y="241" text-anchor="middle">ceramic</text>
<rect x="84" y="292" width="105" height="48" rx="24" fill="#dff1ff"/><text x="137" y="323" text-anchor="middle">11 oz</text>
<rect x="62" y="382" width="172" height="48" rx="24" fill="#fff0bd"/><text x="148" y="413" text-anchor="middle">dishwasher safe</text>
<rect x="697" y="210" width="138" height="48" rx="24" fill="#f4eefb"/><text x="766" y="241" text-anchor="middle">funny gift</text>
<rect x="706" y="292" width="118" height="48" rx="24" fill="#fff0ee"/><text x="765" y="323" text-anchor="middle">office</text>
<rect x="687" y="382" width="156" height="48" rx="24" fill="#dff1ff"/><text x="765" y="413" text-anchor="middle">dog lover</text>
</g>
