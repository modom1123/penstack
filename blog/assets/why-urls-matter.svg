<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Why descriptive URLs matter</title>
<desc id="desc">Side by side comparison of a numeric collection URL and a descriptive rainwear collection URL.</desc>
<rect width="1200" height="900" rx="26" fill="#fffdf8"/>
<text x="600" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#132b3f">Why URLs Matter</text>
<text x="600" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#617080">Clear, descriptive URLs give people and search engines another clue about the page.</text>
<g font-family="Arial,sans-serif">
<rect x="95" y="210" width="455" height="500" rx="22" fill="#fff" stroke="#e4e2d9"/>
<rect x="650" y="210" width="455" height="500" rx="22" fill="#fff" stroke="#e4e2d9"/>
<rect x="135" y="250" width="190" height="52" rx="26" fill="#fff0ee"/><circle cx="165" cy="276" r="15" fill="#c84e35"/><path d="M158 269l14 14m0-14-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="195" y="284" font-size="20" font-weight="700" fill="#17324d">Less helpful</text>
<rect x="690" y="250" width="205" height="52" rx="26" fill="#e7f6ed"/><circle cx="720" cy="276" r="15" fill="#0f6b4f"/><path d="M713 276l6 6 11-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="750" y="284" font-size="20" font-weight="700" fill="#17324d">More helpful</text>
<rect x="135" y="340" width="375" height="84" rx="18" fill="#f5f7f7"/><text x="322" y="393" text-anchor="middle" font-family="monospace" font-size="27" fill="#17324d">/collections/84729</text>
<rect x="690" y="340" width="375" height="84" rx="18" fill="#eef7f1"/><text x="877" y="393" text-anchor="middle" font-family="monospace" font-size="27" fill="#17324d">/collections/rainwear</text>
<rect x="135" y="470" width="375" height="150" rx="16" fill="#fafafa" stroke="#e4e2d9"/>
<circle cx="210" cy="530" r="38" fill="#e6eaed"/><path d="M187 553l20-28 18 22 12-13 22 28h-72z" fill="#c9d1d6"/>
<line x1="275" y1="510" x2="445" y2="510" stroke="#d4dad7" stroke-width="10" stroke-linecap="round"/><line x1="275" y1="540" x2="420" y2="540" stroke="#e1e5e3" stroke-width="10" stroke-linecap="round"/><line x1="275" y1="570" x2="392" y2="570" stroke="#e1e5e3" stroke-width="10" stroke-linecap="round"/>
<rect x="690" y="470" width="375" height="150" rx="16" fill="#fafafa" stroke="#e4e2d9"/>
<path d="M743 570v-70c0-16 13-29 29-29h32c16 0 29 13 29 29v70z" fill="#2f7198"/><path d="M762 499l26-24 26 24" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round"/><line x1="855" y1="510" x2="1015" y2="510" stroke="#d4dad7" stroke-width="10" stroke-linecap="round"/><line x1="855" y1="540" x2="990" y2="540" stroke="#e1e5e3" stroke-width="10" stroke-linecap="round"/><line x1="855" y1="570" x2="965" y2="570" stroke="#e1e5e3" stroke-width="10" stroke-linecap="round"/>
<text x="322" y="665" text-anchor="middle" font-size="18" fill="#617080">Doesn’t explain the page topic.</text>
<text x="877" y="665" text-anchor="middle" font-size="18" fill="#617080">Clearly signals what the page is about.</text>
</g>
<rect x="120" y="760" width="960" height="82" rx="20" fill="#eef4ef" stroke="#d8e9dd"/>
<text x="600" y="794" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17324d">A descriptive URL won’t do SEO by itself.</text>
<text x="600" y="822" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#617080">It reinforces the page topic when it matches the title, description, and products.</text>
</svg>