<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">One product with several useful tags</title>
<desc id="desc">A graphic T-shirt product card with tags for material, audience, use case, season, and merchandising.</desc>
<rect width="900" height="470" rx="22" fill="#fffdf8"/>
<text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#132b3f">One product. Several useful labels.</text>
<text x="450" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#617080">The title names the product. Tags describe the useful dimensions around it.</text>

<rect x="300" y="112" width="300" height="280" rx="18" fill="#fff" stroke="#e4e2d9" stroke-width="2"/>
<rect x="334" y="142" width="232" height="150" rx="14" fill="#eef4ef"/>

