<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">The two jobs of product tags</title><desc id="desc">A split diagram showing internal store organization on the left and customer-facing storefront structure on the right.</desc>
<rect width="900" height="650" rx="28" fill="#fffdf8"/>
<text x="450" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#132b3f">Tags can do two different jobs</text>
<line x1="450" y1="135" x2="450" y2="545" stroke="#e4e2d9" stroke-width="3"/>
<g font-family="Arial,sans-serif">
<text x="230" y="160" text-anchor="middle" font-size="24" font-weight="700" fill="#0f6b4f">Inside your store</text>
<text x="230" y="192" text-anchor="middle" font-size="16" fill="#617080">Operational organization</text>
<rect x="92" y="235" width="276" height="62" rx="14" fill="#eef7f1"/><text x="120" y="272" font-size="18" font-weight="700" fill="#17324d">Filter products faster</text>
<rect x="92" y="315" width="276" height="62" rx="14" fill="#eef7f1"/><text x="120" y="352" font-size="18" font-weight="700" fill="#17324d">Power collection rules</text>
<rect x="92" y="395" width="276" height="62" rx="14" fill="#eef7f1"/><text x="120" y="432" font-size="18" font-weight="700" fill="#17324d">Track campaigns + workflows</text>
<text x="670" y="160" text-anchor="middle" font-size="24" font-weight="700" fill="#df7b28">Across your storefront</text>
<text x="670" y="192" text-anchor="middle" font-size="16" fill="#617080">Customer-facing structure</text>
<rect x="532" y="235" width="276" height="62" rx="14" fill="#fff8ec"/><text x="560" y="272" font-size="18" font-weight="700" fill="#17324d">Create useful collections</text>
<rect x="532" y="315" width="276" height="62" rx="14" fill="#fff8ec"/><text x="560" y="352" font-size="18" font-weight="700" fill="#17324d">Improve navigation paths</text>
<rect x="532" y="395" width="276" height="62" rx="14" fill="#fff8ec"/><text x="560" y="432" font-size="18" font-weight="700" fill="#17324d">Support clearer page topics</text>
</g>
<rect x="135" y="548" width="630" height="52" rx="26" fill="#f4eefb"/><text x="450" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d">Same tags. Different outcomes depending on how you use them.</text>
</svg>