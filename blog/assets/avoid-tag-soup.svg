<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">What inconsistent tags break</title>
<desc id="desc">Four consequences of inconsistent duplicate tags: missed collection rules, split filters, fragmented reporting, and harder maintenance.</desc>
<rect width="1200" height="620" rx="26" fill="#fffdf8"/>
<text x="600" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#132b3f">What tag soup actually breaks</text>
<text x="600" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#617080">Different names for the same idea create operational mess, not just untidy data.</text>

<g font-family="Arial,sans-serif">
  <rect x="70" y="165" width="500" height="150" rx="20" fill="#fff" stroke="#e4e2d9" stroke-width="2"/>
  <circle cx="120" cy="215" r="22" fill="#fff0ee"/><text x="120" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#c84e35">1</text>
  <text x="160" y="205" font-size="22" font-weight="700" fill="#17324d">Collection rules miss products</text>
  <text x="160" y="238" font-size="16" fill="#617080">A rule for “dog-lover-gift” will not catch</text>
  <text x="160" y="265" font-size="16" fill="#617080">products tagged “dog gift” or “dog gifts.”</text>

  <rect x="630" y="165" width="500" height="150" rx="20" fill="#fff" stroke="#e4e2d9" stroke-width="2"/>
  <circle cx="680" cy="215" r="22" fill="#fff0bd"/><text x="680" y="222" text-anchor="middle" font-size="24" font-weight="700" fill="#9a6814">2</text>
  <text x="720" y="205" font-size="22" font-weight="700" fill="#17324d">Filters split the same concept</text>
  <text x="720" y="238" font-size="16" fill="#617080">Shoppers can see several nearly identical</text>
  <text x="720" y="265" font-size="16" fill="#617080">filter choices instead of one useful option.</text>

  <rect x="70" y="345" width="500" height="150" rx="20" fill="#fff" stroke="#e4e2d9" stroke-width="2"/>
  <circle cx="120" cy="395" r="22" fill="#f4eefb"/><text x="120" y="402" text-anchor="middle" font-size="24" font-weight="700" fill="#7b58b5">3</text>
  <text x="160" y="385" font-size="22" font-weight="700" fill="#17324d">Reporting gets fragmented</text>
  <text x="160" y="418" font-size="16" fill="#617080">Products that belong together can end up</text>
  <text x="160" y="445" font-size="16" fill="#617080">counted across different labels.</text>

  <rect x="630" y="345" width="500" height="150" rx="20" fill="#fff" stroke="#e4e2d9" stroke-width="2"/>
  <circle cx="680" cy="395" r="22" fill="#e7f6ed"/><text x="680" y="402" text-anchor="middle" font-size="24" font-weight="700" fill="#0f6b4f">4</text>
  <text x="720" y="385" font-size="22" font-weight="700" fill="#17324d">Maintenance snowballs</text>
  <text x="720" y="418" font-size="16" fill="#617080">Every new duplicate makes future cleanup,</text>
  <text x="720" y="445" font-size="16" fill="#617080">automation, and training harder.</text>
</g>

<rect x="180" y="535" width="840" height="48" rx="24" fill="#eef7f1"/>
<text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d">One consistent tag vocabulary keeps collections, filters, reporting, and workflows aligned.</text>
</svg>