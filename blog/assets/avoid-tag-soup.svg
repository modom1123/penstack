<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Avoid tag soup</title>
<desc id="desc">A comparison between many inconsistent duplicate tags and a smaller standardized tag system.</desc>
<rect width="1200" height="900" rx="26" fill="#fffdf8"/>
<text x="600" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#132b3f">Avoid Tag Soup</text>
<text x="600" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#617080">Consistency makes tags useful for people, automation, collections, and reporting.</text>
<g font-family="Arial,sans-serif">
<rect x="70" y="195" width="500" height="570" rx="22" fill="#fff" stroke="#e4e2d9"/>
<rect x="630" y="195" width="500" height="570" rx="22" fill="#fff" stroke="#e4e2d9"/>
<rect x="105" y="230" width="245" height="62" rx="31" fill="#fff0ee"/><circle cx="140" cy="261" r="18" fill="#c84e35"/><path d="M132 253l16 16m0-16-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="175" y="270" font-size="25" font-weight="700" fill="#17324d">Messy tags</text>
<rect x="665" y="230" width="295" height="62" rx="31" fill="#e7f6ed"/><circle cx="700" cy="261" r="18" fill="#0f6b4f"/><path d="M691 261l7 7 13-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="735" y="270" font-size="25" font-weight="700" fill="#17324d">Organized tags</text>

<g font-size="18" fill="#17324d">
<rect x="120" y="350" width="125" height="46" rx="23" fill="#eee4ff"/><text x="182" y="379" text-anchor="middle">dog gift</text>
<rect x="265" y="332" width="130" height="46" rx="23" fill="#dff1ff"/><text x="330" y="361" text-anchor="middle">dog gifts</text>
<rect x="145" y="420" width="205" height="46" rx="23" fill="#fff0bd"/><text x="247" y="449" text-anchor="middle">gift for dog lovers</text>
<rect x="370" y="405" width="130" height="46" rx="23" fill="#ffe5da"/><text x="435" y="434" text-anchor="middle">Dog Lover</text>
<rect x="112" y="493" width="165" height="46" rx="23" fill="#eee4ff"/><text x="194" y="522" text-anchor="middle">dog lover gift</text>
<rect x="294" y="485" width="125" height="46" rx="23" fill="#dff5ea"/><text x="356" y="514" text-anchor="middle">gifts-dog</text>
<rect x="150" y="563" width="115" height="46" rx="23" fill="#fff0bd"/><text x="207" y="592" text-anchor="middle">gift dog</text>
<rect x="286" y="552" width="125" height="46" rx="23" fill="#dff1ff"/><text x="348" y="581" text-anchor="middle">dog lover</text>
<rect x="360" y="620" width="125" height="46" rx="23" fill="#ffe5da"/><text x="422" y="649" text-anchor="middle">dog-gift</text>

<rect x="690" y="360" width="185" height="54" rx="27" fill="#eee4ff"/><text x="782" y="393" text-anchor="middle">dog-lover-gift</text>
<rect x="900" y="360" width="145" height="54" rx="27" fill="#dff1ff"/><text x="972" y="393" text-anchor="middle">waterproof</text>
<rect x="690" y="445" width="145" height="54" rx="27" fill="#fff0bd"/><text x="762" y="478" text-anchor="middle">small-dog</text>
<rect x="860" y="445" width="125" height="54" rx="27" fill="#dff5ea"/><text x="922" y="478" text-anchor="middle">hiking</text>
</g>
<text x="320" y="720" text-anchor="middle" font-size="17" fill="#617080">Harder to manage. Harder to group.</text>
<text x="880" y="720" text-anchor="middle" font-size="17" fill="#617080">Easier to sort, automate, and build collections.</text>
</g>
<rect x="150" y="805" width="900" height="52" rx="26" fill="#eef4ef" stroke="#d8e9dd"/>
<text x="600" y="838" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17324d">Standardize the vocabulary first. SEO benefits from the cleaner structure you can build later.</text>
</svg>