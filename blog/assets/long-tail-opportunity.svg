<text x="550" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#132b3f">Tags can reveal patterns worth building around</text>
<text x="550" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#617080">The useful insight often appears where several attributes overlap.</text>
