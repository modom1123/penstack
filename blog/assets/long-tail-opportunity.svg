<rect x="90" y="365" width="165" height="52" rx="26" fill="#fff0bd"/><text x="172" y="398" text-anchor="middle">hiking</text>
<rect x="90" y="445" width="165" height="52" rx="26" fill="#f4eefb"/><text x="172" y="478" text-anchor="middle">reflective</text>
</g>
