<rect x="185" y="555" width="730" height="44" rx="22" fill="#f4eefb"/><text x="550" y="583" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">The tags do not create rankings. They help you notice useful catalog themes.</text>
