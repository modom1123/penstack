name: Optimize Batch 3D1 Images

on:
  push:
    paths:
      - ".github/workflows/optimize-batch-3d1.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert heaviest below-the-fold blog PNGs
        run: |
          set -euo pipefail
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-refresh-keep-change-review.png -o penstack-product-refresh-keep-change-review.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-refresh-targeted-updates.png -o penstack-product-refresh-targeted-updates.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none "Image Audit Checklist with Blue Trail Shoe.png" -o "Image Audit Checklist with Blue Trail Shoe.webp"
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-ecommerce-image-accessibility-qa-checklist.png -o blog/assets/penstack-ecommerce-image-accessibility-qa-checklist.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-taxonomy-example-product.png -o penstack-product-taxonomy-example-product.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-agency-onboarding-pilot-before-scaling.png -o penstack-agency-onboarding-pilot-before-scaling.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-refresh-information-gaps.png -o penstack-product-refresh-information-gaps.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-long-tail-keywords-one-product-many-angles.png -o penstack-long-tail-keywords-one-product-many-angles.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-alt-text-examples.png -o blog/assets/penstack-alt-text-examples.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-anatomy-product-description-guide.png -o blog/assets/penstack-anatomy-product-description-guide.webp

      - name: Commit optimized images and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add penstack-product-refresh-keep-change-review.webp                   penstack-product-refresh-targeted-updates.webp                   "Image Audit Checklist with Blue Trail Shoe.webp"                   blog/assets/penstack-ecommerce-image-accessibility-qa-checklist.webp                   penstack-product-taxonomy-example-product.webp                   penstack-agency-onboarding-pilot-before-scaling.webp                   penstack-product-refresh-information-gaps.webp                   penstack-long-tail-keywords-one-product-many-angles.webp                   blog/assets/penstack-alt-text-examples.webp                   blog/assets/penstack-anatomy-product-description-guide.webp
          git rm .github/workflows/optimize-batch-3d1.yml
          git commit -m "Optimize Batch 3D1 blog illustrations to WebP"
          git push
