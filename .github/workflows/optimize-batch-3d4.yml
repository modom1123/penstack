name: Optimize Batch 3D4 Images

on:
  push:
    paths:
      - ".github/workflows/optimize-batch-3d4.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert final active blog PNGs
        run: |
          set -euo pipefail
          for f in             penstack-product-titles-simple-formula.png             penstack-product-tags-reusable-labels-final.png             penstack-collections-shopping-paths-final.png             penstack-catalog-common-mistakes-final.png             penstack-catalog-stable-to-flexible-final.png             penstack-product-accuracy-qa.png             penstack-brand-voice-qa-example.png             penstack-product-listing-seo-qa.png             penstack-product-image-accessibility-qa.png             penstack-product-merchandising-qa.png             penstack-final-approval-qa.png             penstack-product-description-source-check.png             penstack-product-description-two-pass-draft.png             penstack-product-description-before-after.png             penstack-shopify-seo-readable-url-example.png             penstack-shopify-seo-penstack-support.png             penstack-shopify-seo-better-discovery-takeaway.png
          do
            cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none "$f" -o "${f%.png}.webp"
          done

      - name: Commit optimized images and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             penstack-product-titles-simple-formula.webp             penstack-product-tags-reusable-labels-final.webp             penstack-collections-shopping-paths-final.webp             penstack-catalog-common-mistakes-final.webp             penstack-catalog-stable-to-flexible-final.webp             penstack-product-accuracy-qa.webp             penstack-brand-voice-qa-example.webp             penstack-product-listing-seo-qa.webp             penstack-product-image-accessibility-qa.webp             penstack-product-merchandising-qa.webp             penstack-final-approval-qa.webp             penstack-product-description-source-check.webp             penstack-product-description-two-pass-draft.webp             penstack-product-description-before-after.webp             penstack-shopify-seo-readable-url-example.webp             penstack-shopify-seo-penstack-support.webp             penstack-shopify-seo-better-discovery-takeaway.webp
          git rm .github/workflows/optimize-batch-3d4.yml
          git commit -m "Optimize Batch 3D4 remaining blog illustrations to WebP"
          git push
