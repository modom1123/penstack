name: Finish search intent artwork
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finish-search-intent.yml"

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose staged base64
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              ".tmp-search-intent/part00a.txt",".tmp-search-intent/part00b.txt",
              *[f".tmp-search-intent/part{i:02d}.txt" for i in range(1,16)],
              ".tmp-search-intent/part16a.txt",".tmp-search-intent/part16b.txt"
          ]
          chunks=[]
          for fn in files:
              raw=Path(fn).read_text()
              clean="".join(raw.split())
              chunks.append(clean)
              print(fn, "raw", len(raw), "clean", len(clean), "mod4", len(clean)%4,
                    "start", clean[:8], "end", clean[-8:])
          data="".join(chunks)
          bad=[(i,c,ord(c)) for i,c in enumerate(data) if c not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="]
          print("TOTAL", len(data), "mod4", len(data)%4, "bad_count", len(bad))
          print("BAD", bad[:20])
          print("padding_positions", [i for i,c in enumerate(data) if c=="="][:20])
          PY
