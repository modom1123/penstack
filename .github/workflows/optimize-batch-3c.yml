name: Optimize Batch 3C Images

on:
  push:
    paths:
      - ".github/workflows/optimize-batch-3c.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert remaining article hero PNGs to WebP
        run: |
          set -euo pipefail
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-multi-brand-store-boundaries-hero.png -o penstack-multi-brand-store-boundaries-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-product-image-metadata-hero.png -o blog/assets/penstack-product-image-metadata-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-listing-qa-hero.png -o penstack-product-listing-qa-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-taxonomy-hero.png -o penstack-product-taxonomy-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-titles-anatomy.png -o penstack-product-titles-anatomy.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-refresh-audit-map.png -o penstack-product-refresh-audit-map.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-shopify-seo-intent-to-discovery-hd.png -o penstack-shopify-seo-intent-to-discovery-hd.webp

      - name: Commit optimized images and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add penstack-multi-brand-store-boundaries-hero.webp                   blog/assets/penstack-product-image-metadata-hero.webp                   penstack-product-listing-qa-hero.webp                   penstack-product-taxonomy-hero.webp                   penstack-product-titles-anatomy.webp                   penstack-product-refresh-audit-map.webp                   penstack-shopify-seo-intent-to-discovery-hd.webp
          git rm .github/workflows/optimize-batch-3c.yml
          git commit -m "Optimize Batch 3C article hero images to WebP"
          git push
