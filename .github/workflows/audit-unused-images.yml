name: Audit unused website images
on:
  push:
    branches: [chore/audit-unused-website-images]
    paths:
      - scripts/audit-unused-images.py
      - .github/workflows/audit-unused-images.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/audit-unused-website-images
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit-unused-images.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add image-asset-audit.json
          git diff --cached --quiet || git commit -m "Inventory referenced and unreferenced site images"
          git push
