name: Optimize Batch 3D3 Images

on:
  push:
    paths:
      - ".github/workflows/optimize-batch-3d3.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert next active blog illustrations
        run: |
          set -euo pipefail
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-agency-onboarding-sequence.png -o penstack-agency-onboarding-sequence.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-collection-product-vs-collection.png -o penstack-collection-product-vs-collection.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-collection-bare-vs-useful-landing-page.png -o penstack-collection-bare-vs-useful-landing-page.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-ecommerce-image-accessibility-qa-workflow.png -o blog/assets/penstack-ecommerce-image-accessibility-qa-workflow.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-alt-text-definition.png -o blog/assets/penstack-alt-text-definition.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-brand-voice-perspective.png -o penstack-brand-voice-perspective.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-brand-voice-personality.png -o penstack-brand-voice-personality.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-brand-voice-words.png -o penstack-brand-voice-words.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-titles-order-matters.png -o penstack-product-titles-order-matters.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-type-identity-final.png -o penstack-product-type-identity-final.webp

      - name: Commit optimized images and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add penstack-agency-onboarding-sequence.webp                   penstack-collection-product-vs-collection.webp                   penstack-collection-bare-vs-useful-landing-page.webp                   blog/assets/penstack-ecommerce-image-accessibility-qa-workflow.webp                   blog/assets/penstack-alt-text-definition.webp                   penstack-brand-voice-perspective.webp                   penstack-brand-voice-personality.webp                   penstack-brand-voice-words.webp                   penstack-product-titles-order-matters.webp                   penstack-product-type-identity-final.webp
          git rm .github/workflows/optimize-batch-3d3.yml
          git commit -m "Optimize Batch 3D3 blog illustrations to WebP"
          git push
