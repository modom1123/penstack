name: Final Image Cleanup

on:
  push:
    paths:
      - ".github/workflows/final-image-cleanup.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert final active PNG illustrations
        run: |
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-ab-testing-test-anatomy.png -o penstack-ab-testing-test-anatomy.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-ab-testing-one-variable.png -o penstack-ab-testing-one-variable.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-anatomy-product-listing-fields.png -o blog/assets/penstack-anatomy-product-listing-fields.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-anatomy-product-listing-final-review.png -o blog/assets/penstack-anatomy-product-listing-final-review.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-long-tail-keywords-search-intent-best-page-type.png -o penstack-long-tail-keywords-search-intent-best-page-type.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-long-tail-keywords-avoid-micro-collections.png -o penstack-long-tail-keywords-avoid-micro-collections.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-multi-brand-context-boundaries.png -o penstack-multi-brand-context-boundaries.webp
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add penstack-ab-testing-test-anatomy.webp                   penstack-ab-testing-one-variable.webp                   blog/assets/penstack-anatomy-product-listing-fields.webp                   blog/assets/penstack-anatomy-product-listing-final-review.webp                   penstack-long-tail-keywords-search-intent-best-page-type.webp                   penstack-long-tail-keywords-avoid-micro-collections.webp                   penstack-multi-brand-context-boundaries.webp
          git rm .github/workflows/final-image-cleanup.yml
          git commit -m "Optimize final active blog illustrations to WebP"
          git push
