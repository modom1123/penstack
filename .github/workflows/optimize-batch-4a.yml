name: Optimize Batch 4A Images

on:
  push:
    paths:
      - ".github/workflows/optimize-batch-4a.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert images
        run: |
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none sneaker_product_approval_dashboard.png -o sneaker_product_approval_dashboard.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none eco_friendly_green_tee_product_page.png -o eco_friendly_green_tee_product_page.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none three_chats_merging_into_one.png -o three_chats_merging_into_one.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none refresh-existing-product-without-starting-over.png -o refresh-existing-product-without-starting-over.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none document_and_pencil_icon.png -o document_and_pencil_icon.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none sneaker_search_discovery_illustration.png -o sneaker_search_discovery_illustration.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none mug_product_image_with_metadata_card.png -o mug_product_image_with_metadata_card.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none t_shirt_tagging_into_folders.png -o t_shirt_tagging_into_folders.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-illustration-launch-v1.png -o penstack-illustration-launch-v1.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-illustration-refresh-v1.png -o penstack-illustration-refresh-v1.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-illustration-search-intent-v1.png -o penstack-illustration-search-intent-v1.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-illustration-store-contexts-v1.png -o penstack-illustration-store-contexts-v1.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-illustration-review-v1.png -o penstack-illustration-review-v1.webp
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.webp
          git rm .github/workflows/optimize-batch-4a.yml
          git commit -m "Optimize Batch 4A secondary core-page images to WebP"
          git push
