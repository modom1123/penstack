name: Optimize Batch 3B Images

on:
  push:
    paths:
      - ".github/workflows/optimize-batch-3b.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert first article hero batch to WebP
        run: |
          set -euo pipefail
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-ab-testing-hero.png -o penstack-ab-testing-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-agency-onboarding-hero.png -o penstack-agency-onboarding-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-alt-text-hero.png -o blog/assets/penstack-alt-text-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-anatomy-product-listing-overview.png -o blog/assets/penstack-anatomy-product-listing-overview.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-shopify-catalog-audit-hero.png -o penstack-shopify-catalog-audit-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-collection-search-intent-path.png -o penstack-collection-search-intent-path.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none blog/assets/penstack-ecommerce-image-accessibility-qa-hero.png -o blog/assets/penstack-ecommerce-image-accessibility-qa-hero.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-product-description-start-with-facts.png -o penstack-product-description-start-with-facts.webp
          cwebp -quiet -q 86 -m 6 -alpha_q 100 -metadata none penstack-long-tail-keywords-hero-specificity-search.png -o penstack-long-tail-keywords-hero-specificity-search.webp

      - name: Commit optimized images and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add penstack-ab-testing-hero.webp                   penstack-agency-onboarding-hero.webp                   blog/assets/penstack-alt-text-hero.webp                   blog/assets/penstack-anatomy-product-listing-overview.webp                   penstack-shopify-catalog-audit-hero.webp                   penstack-collection-search-intent-path.webp                   blog/assets/penstack-ecommerce-image-accessibility-qa-hero.webp                   penstack-product-description-start-with-facts.webp                   penstack-long-tail-keywords-hero-specificity-search.webp
          git rm .github/workflows/optimize-batch-3b.yml
          git commit -m "Optimize Batch 3B article hero images to WebP"
          git push
